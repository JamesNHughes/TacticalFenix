name: Garmin Connect IQ Build
on:
  push:
    branches: [main, recovery-original-working]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Garmin Connect IQ SDK
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.2.0'
      - name: Restore developer signing key
        shell: bash
        env:
          GARMIN_KEY: ${{ secrets.GARMIN_DEVELOPER_KEY_BASE64 }}
        run: |
          if [ -n "$GARMIN_KEY" ]; then
            printf '%s' "$GARMIN_KEY" | base64 --decode > "$RUNNER_TEMP/developer_key.der"
            echo "Using persistent signing key"
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/temporary.pem"
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/temporary.pem" -out "$RUNNER_TEMP/developer_key.der" -nocrypt
            echo "::warning::Temporary signing key: build is for testing only; set GARMIN_DEVELOPER_KEY_BASE64 for stable updates"
          fi
      - name: Generate launcher icon
        run: |
          python3 - <<'PY'
          import struct,zlib
          w=h=80
          rows=[]
          for y in range(h):
              row=bytearray([0])
              for x in range(w):
                  border=(x<4 or x>=76 or y<4 or y>=76)
                  row.extend((255,136,0) if border else (0,0,0))
              rows.append(bytes(row))
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=bytes.fromhex('89504e470d0a1a0a')+chunk(b'IHDR',struct.pack('>2I5B',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows)))+chunk(b'IEND',b'')
          open('resources/drawables/icon.png','wb').write(png)
          PY
      - name: Compile Tactical Fenix
        run: |
          mkdir -p bin
          monkeyc -f monkey.jungle -d fenix7xpro -o bin/TacticalFenix.prg -y "$RUNNER_TEMP/developer_key.der"
      - uses: actions/upload-artifact@v4
        with:
          name: TacticalFenix-fenix7xpro
          path: bin/TacticalFenix.prg
          if-no-files-found: error
